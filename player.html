<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
#stage{position:fixed;top:0;left:0;width:100%;height:100%;background:#000}
#stage img,#stage video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
#msg{position:fixed;top:0;left:0;width:100%;height:100%;color:#777;font:32px sans-serif;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="stage"></div>
<div id="msg">Loading...</div>
<script>
var SUPABASE_URL = 'https://voqbltomtzpvuirtpjdq.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvcWJsdG9tdHpwdnVpcnRwamRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODUwNTQsImV4cCI6MjEwNzQ2MTA1NH0.A6n1OjCKtKC5GSykLLc0J9DMSSO1R1PZ3WgfKTpKj_0';

var list = [], pending = null, index = 0, timer = null;

function load(cb) {
  var x = new XMLHttpRequest();
  x.open('GET', SUPABASE_URL + '/rest/v1/playlist?select=file_url,file_type,duration_seconds&active=eq.true&order=position.asc');
  x.setRequestHeader('apikey', KEY);
  x.setRequestHeader('Authorization', 'Bearer ' + KEY);
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status === 200) {
      try { cb(JSON.parse(x.responseText)); } catch (e) {}
    }
  };
  x.send();
}

function refresh() {
  load(function (d) {
    pending = d;
    if (!list.length) next();
  });
}

function next() {
  clearTimeout(timer);
  if (pending) { list = pending; pending = null; index = 0; }
  var stage = document.getElementById('stage');
  var msg = document.getElementById('msg');
  stage.innerHTML = '';
  if (!list.length) {
    msg.style.display = 'flex';
    msg.innerHTML = 'No content yet';
    timer = setTimeout(next, 10000);
    return;
  }
  msg.style.display = 'none';
  if (index >= list.length) index = 0;
  var item = list[index];
  index++;
  var done = false;
  function finish() { if (done) return; done = true; next(); }

  if (item.file_type === 'video') {
    var v = document.createElement('video');
    v.muted = true;
    v.autoplay = true;
    v.setAttribute('playsinline', '');
    v.onended = finish;
    v.onerror = finish;
    v.src = item.file_url;
    stage.appendChild(v);
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
    timer = setTimeout(finish, 120000);
  } else {
    var im = document.createElement('img');
    im.onerror = finish;
    im.src = item.file_url;
    stage.appendChild(im);
    timer = setTimeout(finish, (item.duration_seconds || 8) * 1000);
  }
}

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
