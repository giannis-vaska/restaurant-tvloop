<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Admin</title>
<style>
body{font-family:sans-serif;margin:0;padding:16px;background:#111;color:#eee;max-width:600px}
input,button{font-size:16px;padding:10px;border-radius:8px;border:0;margin:4px 0}
input{background:#222;color:#eee;width:100%;box-sizing:border-box}
button{background:#2d7ff9;color:#fff}
button.gray{background:#444}
button.red{background:#c0392b}
.card{background:#1c1c1c;border-radius:10px;padding:10px;margin:10px 0}
.card.off{opacity:.45}
.thumb{width:100%;max-height:160px;object-fit:contain;background:#000;border-radius:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.row input{width:80px;padding:6px}
#status{color:#9c9;margin:8px 0}
#loginerr{color:#e88}
.hidden{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<h2>TV Admin</h2>

<div id="login">
  <input id="email" type="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Log in</button>
  <div id="loginerr"></div>
</div>

<div id="app" class="hidden">
  <button class="gray" onclick="logout()">Log out</button>
  <h3>Upload</h3>
  <input id="file" type="file" accept="image/*,video/*">
  <div>Image seconds: <input id="newdur" type="number" value="8" min="1" style="width:80px"></div>
  <button onclick="upload()">Upload</button>
  <div id="status"></div>
  <h3>Playlist</h3>
  <div id="list"></div>
</div>

<script>
var SUPABASE_URL = 'https://voqbltomtzpvuirtpjdq.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvcWJsdG9tdHpwdnVpcnRwamRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODUwNTQsImV4cCI6MjEwNzQ2MTA1NH0.A6n1OjCKtKC5GSykLLc0J9DMSSO1R1PZ3WgfKTpKj_0';
var sb = supabase.createClient(SUPABASE_URL, KEY);
var items = [];

function $(id){ return document.getElementById(id); }
function say(t){ $('status').textContent = t; }

async function init(){
  var r = await sb.auth.getSession();
  show(!!r.data.session);
}
function show(on){
  $('login').classList.toggle('hidden', on);
  $('app').classList.toggle('hidden', !on);
  if (on) loadItems();
}
async function login(){
  var r = await sb.auth.signInWithPassword({email:$('email').value, password:$('pass').value});
  if (r.error){ $('loginerr').textContent = r.error.message; return; }
  $('loginerr').textContent = '';
  show(true);
}
async function logout(){ await sb.auth.signOut(); show(false); }

async function loadItems(){
  var r = await sb.from('playlist').select('*').order('position',{ascending:true});
  if (r.error){ say(r.error.message); return; }
  items = r.data;
  render();
}

function render(){
  var box = $('list');
  box.innerHTML = '';
  if (!items.length){ box.textContent = 'Nothing yet. Upload something above.'; return; }
  items.forEach(function(it, i){
    var d = document.createElement('div');
    d.className = 'card' + (it.active ? '' : ' off');
    var t = document.createElement(it.file_type === 'video' ? 'video' : 'img');
    t.className = 'thumb';
    t.src = it.file_url;
    if (it.file_type === 'video'){ t.muted = true; t.controls = true; t.preload = 'metadata'; }
    d.appendChild(t);
    var row = document.createElement('div');
    row.className = 'row';
    var h = '';
    if (it.file_type === 'image'){
      h += 'Seconds: <input type="number" min="1" value="' + it.duration_seconds + '" onchange="setDur(' + i + ',this.value)">';
    } else {
      h += 'Video (plays fully)';
    }
    h += '<button class="gray" onclick="move(' + i + ',-1)">&uarr;</button>';
    h += '<button class="gray" onclick="move(' + i + ',1)">&darr;</button>';
    h += '<button class="gray" onclick="toggle(' + i + ')">' + (it.active ? 'Hide' : 'Show') + '</button>';
    h += '<button class="red" onclick="del(' + i + ')">Delete</button>';
    row.innerHTML = h;
    d.appendChild(row);
    box.appendChild(d);
  });
}

async function upload(){
  var f = $('file').files[0];
  if (!f){ say('Choose a file first'); return; }
  var type = f.type.indexOf('video') === 0 ? 'video' : 'image';
  var path = Date.now() + '_' + f.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  say('Uploading...');
  var up = await sb.storage.from('media').upload(path, f);
  if (up.error){ say('Error: ' + up.error.message); return; }
  var url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
  var maxPos = items.reduce(function(m, x){ return Math.max(m, x.position); }, 0);
  var ins = await sb.from('playlist').insert({
    file_url: url,
    file_type: type,
    duration_seconds: parseInt($('newdur').value) || 8,
    position: maxPos + 1
  });
  if (ins.error){ say('Error: ' + ins.error.message); return; }
  $('file').value = '';
  say('Uploaded!');
  loadItems();
}

async function setDur(i, v){
  await sb.from('playlist').update({duration_seconds: parseInt(v) || 8}).eq('id', items[i].id);
  loadItems();
}
async function toggle(i){
  await sb.from('playlist').update({active: !items[i].active}).eq('id', items[i].id);
  loadItems();
}
async function move(i, dir){
  var a = items[i], b = items[i + dir];
  if (!b) return;
  await sb.from('playlist').update({position: b.position}).eq('id', a.id);
  await sb.from('playlist').update({position: a.position}).eq('id', b.id);
  loadItems();
}
async function del(i){
  var it = items[i];
  if (!confirm('Delete this item?')) return;
  var part = it.file_url.split('/media/')[1];
  if (part) await sb.storage.from('media').remove([decodeURIComponent(part)]);
  await sb.from('playlist').delete().eq('id', it.id);
  loadItems();
}

init();
</script>
</body>
</html>
